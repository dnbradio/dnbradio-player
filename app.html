<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head {{ HEAD_ATTRS }}>
    {{ HEAD }}
    <!-- Outside vue-meta's head tags: vue-meta re-inserts a script tag that
         Cloudflare's Rocket Loader has rewritten, which ran Plausible twice
         and counted every pageview twice. -->
    <script
      defer
      data-domain="dnbradio.com"
      src="https://plausible.io/js/script.js"
    ></script>
  </head>
  <body {{ BODY_ATTRS }}>
    {{ APP }}
  </body>
</html>
