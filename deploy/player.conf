# Include generated dj-previews/nginx-maps.conf in the nginx http context first.
# Main-stream HTML varies by the allowlisted DJ query. Other routes remain static.
location = /player/ {
    try_files $dnb_player_dj_page /player/index.html =404;
}
location = /player/stations/1 {
    try_files $dnb_player_dj_page $uri $uri/ /player/200.html;
}
location = /player/stations/1/ {
    try_files $dnb_player_dj_page /player/stations/1/index.html =404;
}
location /player/ {
    try_files $uri $uri/ /player/200.html;
}
